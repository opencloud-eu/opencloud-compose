---
services:
  imagor:
    image: ${IMAGOR_DOCKER_IMAGE:-shumc/imagor}:${IMAGOR_DOCKER_TAG:-1.10.6}
    environment:
      IMAGOR_UNSAFE: "true"
      UPLOAD_LOADER_ENABLE: "true"
      UPLOAD_LOADER_MAX_ALLOWED_SIZE: ${IMAGOR_MAX_SOURCE_SIZE:-50000000}
      HTTP_LOADER_DISABLE: "true"
      VIPS_MAX_WIDTH: "7680"
      VIPS_MAX_HEIGHT: "7680"
      VIPS_MAX_ANIMATION_FRAMES: "100"
    networks:
      imagor-net:
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: always
    logging:
      driver: ${LOG_DRIVER:-local}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  opencloud:
    environment:
      WEBDAV_THUMBNAILS_GENERATOR_URL: http://imagor:8000
      OC_THUMBNAILS_ADDITIONAL_SOURCE_TYPES: ${THUMBNAILS_ADDITIONAL_SOURCE_TYPES:-image/heic,image/heif,image/avif,image/heic-sequence,image/heif-sequence}
    networks:
      imagor-net:
    # replaces the thumbnails container, so opencloud must not wait for it
    depends_on: !override
      imagor:
        condition: service_healthy

  # imagor replaces the built-in thumbnails container. Scaling it to 0 also stops
  # it when imagor is added to an existing deployment.
  thumbnails:
    deploy:
      replicas: 0

networks:
  imagor-net:
    internal: true
